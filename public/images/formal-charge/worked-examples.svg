<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Worked formal charge examples</title>
  <desc id="desc">Examples showing neutral oxygen in water, positive nitrogen in ammonium, negative oxygen in hydroxide, and positive carbon in a carbocation.</desc>
  <rect width="1200" height="760" rx="36" fill="#f8fafc"/>
  <text x="600" y="76" text-anchor="middle" font-family="Arial, sans-serif" font-size="42" font-weight="700" fill="#0f172a">Worked formal-charge patterns</text>
  <text x="600" y="116" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#475569">Count valence electrons, lone-pair electrons, and bond lines</text>

  <g transform="translate(70 160)">
    <rect width="500" height="240" rx="26" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <text x="250" y="42" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#0f172a">Oxygen in H₂O</text>
    <text x="155" y="126" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#0f172a">H</text>
    <line x1="192" y1="115" x2="232" y2="115" stroke="#0f172a" stroke-width="6"/>
    <text x="250" y="128" text-anchor="middle" font-family="Arial, sans-serif" font-size="38" font-weight="700" fill="#dc2626">O</text>
    <line x1="268" y1="115" x2="308" y2="115" stroke="#0f172a" stroke-width="6"/>
    <text x="330" y="126" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#0f172a">H</text>
    <circle cx="228" cy="82" r="6" fill="#0f172a"/><circle cx="244" cy="82" r="6" fill="#0f172a"/>
    <circle cx="256" cy="82" r="6" fill="#0f172a"/><circle cx="272" cy="82" r="6" fill="#0f172a"/>
    <text x="250" y="178" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#334155">6 − 4 − 2 = 0</text>
    <rect x="170" y="195" width="160" height="32" rx="16" fill="#dcfce7"/>
    <text x="250" y="218" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#15803d">neutral oxygen</text>
  </g>

  <g transform="translate(630 160)">
    <rect width="500" height="240" rx="26" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <text x="250" y="42" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#0f172a">Nitrogen in NH₄⁺</text>
    <text x="250" y="126" text-anchor="middle" font-family="Arial, sans-serif" font-size="38" font-weight="700" fill="#2563eb">N</text>
    <text x="250" y="78" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" fill="#0f172a">H</text>
    <text x="250" y="172" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" fill="#0f172a">H</text>
    <text x="180" y="128" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" fill="#0f172a">H</text>
    <text x="320" y="128" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" fill="#0f172a">H</text>
    <line x1="250" y1="88" x2="250" y2="100" stroke="#0f172a" stroke-width="5"/>
    <line x1="250" y1="138" x2="250" y2="150" stroke="#0f172a" stroke-width="5"/>
    <line x1="198" y1="116" x2="226" y2="116" stroke="#0f172a" stroke-width="5"/>
    <line x1="274" y1="116" x2="302" y2="116" stroke="#0f172a" stroke-width="5"/>
    <text x="250" y="198" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#334155">5 − 0 − 4 = +1</text>
    <rect x="172" y="207" width="156" height="28" rx="14" fill="#dbeafe"/>
    <text x="250" y="227" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#1d4ed8">positive nitrogen</text>
  </g>

  <g transform="translate(70 450)">
    <rect width="500" height="240" rx="26" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <text x="250" y="42" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#0f172a">Oxygen in OH⁻</text>
    <text x="205" y="128" text-anchor="middle" font-family="Arial, sans-serif" font-size="38" font-weight="700" fill="#dc2626">O</text>
    <line x1="230" y1="115" x2="278" y2="115" stroke="#0f172a" stroke-width="6"/>
    <text x="310" y="126" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#0f172a">H</text>
    <circle cx="180" cy="82" r="6" fill="#0f172a"/><circle cx="196" cy="82" r="6" fill="#0f172a"/>
    <circle cx="212" cy="82" r="6" fill="#0f172a"/><circle cx="228" cy="82" r="6" fill="#0f172a"/>
    <circle cx="180" cy="150" r="6" fill="#0f172a"/><circle cx="196" cy="150" r="6" fill="#0f172a"/>
    <text x="250" y="178" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#334155">6 − 6 − 1 = −1</text>
    <rect x="170" y="195" width="160" height="32" rx="16" fill="#fee2e2"/>
    <text x="250" y="218" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#b91c1c">negative oxygen</text>
  </g>

  <g transform="translate(630 450)">
    <rect width="500" height="240" rx="26" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <text x="250" y="42" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#0f172a">Carbon in CH₃⁺</text>
    <text x="250" y="126" text-anchor="middle" font-family="Arial, sans-serif" font-size="38" font-weight="700" fill="#16a34a">C</text>
    <text x="250" y="78" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" fill="#0f172a">H</text>
    <text x="182" y="145" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" fill="#0f172a">H</text>
    <text x="318" y="145" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" fill="#0f172a">H</text>
    <line x1="250" y1="88" x2="250" y2="101" stroke="#0f172a" stroke-width="5"/>
    <line x1="205" y1="132" x2="228" y2="122" stroke="#0f172a" stroke-width="5"/>
    <line x1="272" y1="122" x2="295" y2="132" stroke="#0f172a" stroke-width="5"/>
    <text x="250" y="180" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#334155">4 − 0 − 3 = +1</text>
    <rect x="174" y="197" width="152" height="30" rx="15" fill="#dbeafe"/>
    <text x="250" y="218" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#1d4ed8">carbocation</text>
  </g>
</svg>
