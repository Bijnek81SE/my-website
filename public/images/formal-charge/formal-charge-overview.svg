<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Formal charge overview</title>
  <desc id="desc">A visual formula showing valence electrons minus nonbonding electrons minus half the bonding electrons.</desc>
  <rect width="1200" height="720" rx="36" fill="#f1f5f9"/>
  <text x="600" y="82" text-anchor="middle" font-family="Arial, sans-serif" font-size="42" font-weight="700" fill="#0f172a">Formal charge is electron bookkeeping</text>
  <text x="600" y="124" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#475569">Compare normal valence electrons with the electrons assigned in a Lewis structure</text>

  <g transform="translate(80 190)">
    <rect width="260" height="250" rx="28" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <circle cx="130" cy="78" r="46" fill="#dbeafe" stroke="#2563eb" stroke-width="5"/>
    <text x="130" y="91" text-anchor="middle" font-family="Arial, sans-serif" font-size="38" font-weight="700" fill="#1d4ed8">V</text>
    <text x="130" y="160" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#0f172a">Valence electrons</text>
    <text x="130" y="198" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#475569">From the periodic table</text>
  </g>

  <text x="390" y="335" text-anchor="middle" font-family="Arial, sans-serif" font-size="54" font-weight="700" fill="#334155">−</text>

  <g transform="translate(470 190)">
    <rect width="260" height="250" rx="28" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <circle cx="112" cy="74" r="10" fill="#0f172a"/><circle cx="148" cy="74" r="10" fill="#0f172a"/>
    <circle cx="112" cy="106" r="10" fill="#0f172a"/><circle cx="148" cy="106" r="10" fill="#0f172a"/>
    <text x="130" y="160" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#0f172a">Nonbonding</text>
    <text x="130" y="193" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#0f172a">electrons</text>
    <text x="130" y="224" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#475569">All lone-pair electrons</text>
  </g>

  <text x="780" y="335" text-anchor="middle" font-family="Arial, sans-serif" font-size="54" font-weight="700" fill="#334155">−</text>

  <g transform="translate(860 190)">
    <rect width="260" height="250" rx="28" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <circle cx="75" cy="90" r="34" fill="#dcfce7" stroke="#16a34a" stroke-width="4"/>
    <circle cx="185" cy="90" r="34" fill="#dcfce7" stroke="#16a34a" stroke-width="4"/>
    <line x1="109" y1="90" x2="151" y2="90" stroke="#0f172a" stroke-width="8" stroke-linecap="round"/>
    <text x="130" y="160" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#0f172a">½ bonding</text>
    <text x="130" y="193" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#0f172a">electrons</text>
    <text x="130" y="224" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#475569">Equivalent to bond lines</text>
  </g>

  <rect x="160" y="505" width="880" height="115" rx="26" fill="#0f172a"/>
  <text x="600" y="552" text-anchor="middle" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#ffffff">Formal charge = V − nonbonding electrons − number of bonds</text>
  <text x="600" y="594" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#cbd5e1">Then check that all atomic formal charges add to the overall charge</text>
</svg>
