<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Six steps for drawing a Lewis structure</title>
  <desc id="desc">A flowchart showing count electrons, choose skeleton, connect atoms, complete terminal octets, complete central atom, and check formal charges.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#eff6ff"/><stop offset="1" stop-color="#f8fafc"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0f172a" flood-opacity=".10"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/></marker>
  </defs>
  <rect width="1200" height="760" rx="32" fill="url(#bg)"/>
  <text x="600" y="70" text-anchor="middle" font-family="Arial, sans-serif" font-size="38" font-weight="700" fill="#0f172a">How to draw a Lewis structure</text>
  <text x="600" y="108" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" fill="#475569">A repeatable electron-bookkeeping workflow</text>
  <g font-family="Arial, sans-serif" filter="url(#shadow)">
    <g transform="translate(90 160)"><rect width="300" height="190" rx="24" fill="white"/><circle cx="45" cy="45" r="25" fill="#2563eb"/><text x="45" y="53" text-anchor="middle" font-size="24" font-weight="700" fill="white">1</text><text x="82" y="52" font-size="24" font-weight="700" fill="#0f172a">Count electrons</text><text x="32" y="100" font-size="17" fill="#475569">Add all valence electrons.</text><text x="32" y="132" font-size="17" fill="#475569">Adjust for the overall charge.</text></g>
    <g transform="translate(450 160)"><rect width="300" height="190" rx="24" fill="white"/><circle cx="45" cy="45" r="25" fill="#2563eb"/><text x="45" y="53" text-anchor="middle" font-size="24" font-weight="700" fill="white">2</text><text x="82" y="52" font-size="24" font-weight="700" fill="#0f172a">Choose skeleton</text><text x="32" y="100" font-size="17" fill="#475569">Put the least electronegative</text><text x="32" y="132" font-size="17" fill="#475569">atom near the centre.</text></g>
    <g transform="translate(810 160)"><rect width="300" height="190" rx="24" fill="white"/><circle cx="45" cy="45" r="25" fill="#2563eb"/><text x="45" y="53" text-anchor="middle" font-size="24" font-weight="700" fill="white">3</text><text x="82" y="52" font-size="24" font-weight="700" fill="#0f172a">Connect atoms</text><text x="32" y="100" font-size="17" fill="#475569">Use single bonds first.</text><text x="32" y="132" font-size="17" fill="#475569">Each line uses two electrons.</text></g>
    <g transform="translate(90 440)"><rect width="300" height="190" rx="24" fill="white"/><circle cx="45" cy="45" r="25" fill="#7c3aed"/><text x="45" y="53" text-anchor="middle" font-size="24" font-weight="700" fill="white">6</text><text x="82" y="52" font-size="24" font-weight="700" fill="#0f172a">Check</text><text x="32" y="100" font-size="17" fill="#475569">Count electrons and octets.</text><text x="32" y="132" font-size="17" fill="#475569">Evaluate formal charges.</text></g>
    <g transform="translate(450 440)"><rect width="300" height="190" rx="24" fill="white"/><circle cx="45" cy="45" r="25" fill="#0f9f6e"/><text x="45" y="53" text-anchor="middle" font-size="24" font-weight="700" fill="white">5</text><text x="82" y="52" font-size="22" font-weight="700" fill="#0f172a">Central atom</text><text x="32" y="100" font-size="17" fill="#475569">Place remaining electrons.</text><text x="32" y="132" font-size="17" fill="#475569">Form multiple bonds if needed.</text></g>
    <g transform="translate(810 440)"><rect width="300" height="190" rx="24" fill="white"/><circle cx="45" cy="45" r="25" fill="#0f9f6e"/><text x="45" y="53" text-anchor="middle" font-size="24" font-weight="700" fill="white">4</text><text x="82" y="52" font-size="23" font-weight="700" fill="#0f172a">Terminal octets</text><text x="32" y="100" font-size="17" fill="#475569">Complete outside atoms first.</text><text x="32" y="132" font-size="17" fill="#475569">Hydrogen needs only two.</text></g>
  </g>
  <g stroke="#2563eb" stroke-width="5" fill="none" marker-end="url(#arrow)"><path d="M400 255 H438"/><path d="M760 255 H798"/><path d="M1060 365 C1060 405 1030 420 990 430"/><path d="M800 535 H762"/><path d="M440 535 H402"/></g>
</svg>
