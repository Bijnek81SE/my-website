<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Worked Lewis structure examples</title>
  <desc id="desc">Lewis structures for water, carbon dioxide, ammonia, and ammonium, with bonds and lone pairs.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8fafc"/><stop offset="1" stop-color="#eef2ff"/></linearGradient><filter id="shadow"><feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#0f172a" flood-opacity=".09"/></filter></defs>
  <rect width="1200" height="760" rx="32" fill="url(#bg)"/>
  <text x="600" y="68" text-anchor="middle" font-family="Arial, sans-serif" font-size="38" font-weight="700" fill="#0f172a">Worked Lewis structures</text>
  <text x="600" y="106" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" fill="#475569">Bonds use shared pairs; dots show lone-pair electrons</text>
  <g font-family="Arial, sans-serif" filter="url(#shadow)">
    <g transform="translate(70 155)"><rect width="500" height="235" rx="24" fill="white"/><text x="250" y="45" text-anchor="middle" font-size="26" font-weight="700" fill="#0f172a">Water · H₂O</text><text x="250" y="83" text-anchor="middle" font-size="16" fill="#64748b">8 valence electrons</text><g transform="translate(120 120)" font-size="42" font-weight="700"><text x="0" y="42" fill="#2563eb">H</text><line x1="45" y1="28" x2="105" y2="28" stroke="#0f172a" stroke-width="5"/><text x="122" y="42" fill="#dc2626">O</text><line x1="165" y1="28" x2="225" y2="28" stroke="#0f172a" stroke-width="5"/><text x="240" y="42" fill="#2563eb">H</text><circle cx="132" cy="-1" r="5" fill="#0f172a"/><circle cx="151" cy="-1" r="5" fill="#0f172a"/><circle cx="132" cy="67" r="5" fill="#0f172a"/><circle cx="151" cy="67" r="5" fill="#0f172a"/></g></g>
    <g transform="translate(630 155)"><rect width="500" height="235" rx="24" fill="white"/><text x="250" y="45" text-anchor="middle" font-size="26" font-weight="700" fill="#0f172a">Carbon dioxide · CO₂</text><text x="250" y="83" text-anchor="middle" font-size="16" fill="#64748b">16 valence electrons</text><g transform="translate(120 120)" font-size="42" font-weight="700"><text x="0" y="42" fill="#dc2626">O</text><line x1="48" y1="18" x2="108" y2="18" stroke="#0f172a" stroke-width="5"/><line x1="48" y1="38" x2="108" y2="38" stroke="#0f172a" stroke-width="5"/><text x="124" y="42" fill="#16a34a">C</text><line x1="168" y1="18" x2="228" y2="18" stroke="#0f172a" stroke-width="5"/><line x1="168" y1="38" x2="228" y2="38" stroke="#0f172a" stroke-width="5"/><text x="244" y="42" fill="#dc2626">O</text><g fill="#0f172a"><circle cx="5" cy="-5" r="5"/><circle cx="24" cy="-5" r="5"/><circle cx="5" cy="68" r="5"/><circle cx="24" cy="68" r="5"/><circle cx="252" cy="-5" r="5"/><circle cx="271" cy="-5" r="5"/><circle cx="252" cy="68" r="5"/><circle cx="271" cy="68" r="5"/></g></g></g>
    <g transform="translate(70 435)"><rect width="500" height="235" rx="24" fill="white"/><text x="250" y="45" text-anchor="middle" font-size="26" font-weight="700" fill="#0f172a">Ammonia · NH₃</text><text x="250" y="83" text-anchor="middle" font-size="16" fill="#64748b">8 valence electrons</text><g transform="translate(175 105)" font-size="38" font-weight="700"><text x="57" y="50" fill="#7c3aed">N</text><text x="0" y="50" fill="#2563eb">H</text><text x="125" y="50" fill="#2563eb">H</text><text x="58" y="125" fill="#2563eb">H</text><line x1="38" y1="38" x2="55" y2="38" stroke="#0f172a" stroke-width="5"/><line x1="92" y1="38" x2="116" y2="38" stroke="#0f172a" stroke-width="5"/><line x1="74" y1="60" x2="74" y2="91" stroke="#0f172a" stroke-width="5"/><circle cx="65" cy="6" r="5" fill="#0f172a"/><circle cx="84" cy="6" r="5" fill="#0f172a"/></g></g>
    <g transform="translate(630 435)"><rect width="500" height="235" rx="24" fill="white"/><text x="250" y="45" text-anchor="middle" font-size="26" font-weight="700" fill="#0f172a">Ammonium · NH₄⁺</text><text x="250" y="83" text-anchor="middle" font-size="16" fill="#64748b">8 valence electrons</text><g transform="translate(145 100)" font-size="34" font-weight="700"><path d="M20 5 H190 M20 5 V145 M20 145 H190 M190 5 V145" fill="none" stroke="#64748b" stroke-width="3"/><text x="91" y="82" fill="#7c3aed">N</text><text x="91" y="35" fill="#2563eb">H</text><text x="91" y="132" fill="#2563eb">H</text><text x="43" y="82" fill="#2563eb">H</text><text x="142" y="82" fill="#2563eb">H</text><line x1="105" y1="48" x2="105" y2="58" stroke="#0f172a" stroke-width="4"/><line x1="105" y1="90" x2="105" y2="103" stroke="#0f172a" stroke-width="4"/><line x1="72" y1="72" x2="88" y2="72" stroke="#0f172a" stroke-width="4"/><line x1="121" y1="72" x2="139" y2="72" stroke="#0f172a" stroke-width="4"/><text x="199" y="22" font-size="25" fill="#0f172a">+</text></g></g>
  </g>
</svg>
