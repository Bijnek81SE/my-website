<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Curved arrow notation</title>
  <desc id="desc">Examples showing a lone pair forming a pi bond and a pi bond moving onto an atom.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8fafc"/><stop offset="1" stop-color="#eef2ff"/></linearGradient>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#2563eb"/></marker>
    <filter id="shadow"><feDropShadow dx="0" dy="12" stdDeviation="14" flood-opacity="0.10"/></filter>
  </defs>
  <rect width="1200" height="720" rx="32" fill="url(#bg)"/>
  <text x="600" y="70" text-anchor="middle" font-family="Arial" font-size="36" font-weight="700" fill="#0f172a">How curved arrows move electron pairs</text>
  <text x="600" y="110" text-anchor="middle" font-family="Arial" font-size="20" fill="#475569">The tail starts at electrons; the head points to their destination</text>

  <g filter="url(#shadow)">
    <rect x="80" y="160" width="480" height="430" rx="28" fill="#fff"/>
    <rect x="640" y="160" width="480" height="430" rx="28" fill="#fff"/>
  </g>
  <text x="320" y="215" text-anchor="middle" font-family="Arial" font-size="25" font-weight="700" fill="#0f172a">Lone pair → bond</text>
  <text x="880" y="215" text-anchor="middle" font-family="Arial" font-size="25" font-weight="700" fill="#0f172a">π bond → atom</text>

  <g font-family="Arial" font-size="48" font-weight="700" text-anchor="middle">
    <text x="220" y="390" fill="#dc2626">O⁻</text><text x="395" y="390" fill="#0f172a">C</text>
    <text x="785" y="390" fill="#0f172a">C</text><text x="960" y="390" fill="#dc2626">O</text>
  </g>
  <g fill="#0f172a"><circle cx="205" cy="310" r="8"/><circle cx="235" cy="310" r="8"/></g>
  <g stroke="#0f172a" stroke-width="9" stroke-linecap="round">
    <line x1="265" y1="375" x2="350" y2="375"/>
    <line x1="830" y1="368" x2="915" y2="368"/><line x1="830" y1="388" x2="915" y2="388"/>
  </g>
  <path d="M220 300 C275 245, 355 260, 372 335" fill="none" stroke="#2563eb" stroke-width="8" marker-end="url(#arrow)"/>
  <path d="M870 350 C900 280, 990 275, 1015 345" fill="none" stroke="#2563eb" stroke-width="8" marker-end="url(#arrow)"/>

  <rect x="135" y="455" width="370" height="85" rx="18" fill="#eff6ff"/>
  <text x="320" y="490" text-anchor="middle" font-family="Arial" font-size="20" font-weight="700" fill="#1d4ed8">Arrow tail: lone pair</text>
  <text x="320" y="520" text-anchor="middle" font-family="Arial" font-size="18" fill="#475569">Arrow head: new π bond</text>

  <rect x="695" y="455" width="370" height="85" rx="18" fill="#f5f3ff"/>
  <text x="880" y="490" text-anchor="middle" font-family="Arial" font-size="20" font-weight="700" fill="#6d28d9">Arrow tail: π bond</text>
  <text x="880" y="520" text-anchor="middle" font-family="Arial" font-size="18" fill="#475569">Arrow head: receiving atom</text>

  <rect x="220" y="625" width="760" height="55" rx="16" fill="#0f172a"/>
  <text x="600" y="660" text-anchor="middle" font-family="Arial" font-size="22" fill="#fff">Never start a curved arrow at a charge symbol or at an atom label.</text>
</svg>
