<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Resonance contributors and resonance hybrid</title>
  <desc id="desc">Two equivalent carboxylate resonance contributors point to a resonance hybrid with equal carbon oxygen bonds.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#eff6ff"/><stop offset="1" stop-color="#f5f3ff"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="14" stdDeviation="16" flood-opacity="0.12"/></filter>
  </defs>
  <rect width="1200" height="720" rx="32" fill="url(#bg)"/>
  <text x="600" y="72" text-anchor="middle" font-family="Arial, sans-serif" font-size="36" font-weight="700" fill="#0f172a">Resonance contributors describe one hybrid</text>
  <text x="600" y="112" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#475569">The atoms stay fixed while electron density is delocalised</text>

  <g filter="url(#shadow)">
    <rect x="70" y="170" width="320" height="360" rx="26" fill="#fff"/>
    <rect x="440" y="170" width="320" height="360" rx="26" fill="#fff"/>
    <rect x="810" y="170" width="320" height="360" rx="26" fill="#fff"/>
  </g>

  <text x="230" y="220" text-anchor="middle" font-family="Arial" font-size="24" font-weight="700" fill="#0f172a">Contributor A</text>
  <text x="600" y="220" text-anchor="middle" font-family="Arial" font-size="24" font-weight="700" fill="#0f172a">Contributor B</text>
  <text x="970" y="220" text-anchor="middle" font-family="Arial" font-size="24" font-weight="700" fill="#0f172a">Resonance hybrid</text>

  <g font-family="Arial" font-size="42" font-weight="700" fill="#0f172a" text-anchor="middle">
    <text x="230" y="365">C</text><text x="130" y="300" fill="#dc2626">O</text><text x="330" y="430" fill="#dc2626">O⁻</text>
    <text x="600" y="365">C</text><text x="500" y="430" fill="#dc2626">O⁻</text><text x="700" y="300" fill="#dc2626">O</text>
    <text x="970" y="365">C</text><text x="870" y="300" fill="#dc2626">O</text><text x="1070" y="430" fill="#dc2626">O</text>
  </g>

  <g stroke="#1d4ed8" stroke-width="9" stroke-linecap="round">
    <line x1="205" y1="335" x2="155" y2="305"/><line x1="216" y1="320" x2="166" y2="290"/>
    <line x1="254" y1="385" x2="305" y2="418"/>
    <line x1="575" y1="385" x2="525" y2="418"/>
    <line x1="625" y1="335" x2="675" y2="305"/><line x1="636" y1="320" x2="686" y2="290"/>
  </g>
  <g stroke="#7c3aed" stroke-width="8" stroke-linecap="round" stroke-dasharray="12 12">
    <line x1="945" y1="340" x2="895" y2="310"/><line x1="995" y1="390" x2="1045" y2="420"/>
  </g>
  <text x="970" y="490" text-anchor="middle" font-family="Arial" font-size="22" fill="#6d28d9">equal C–O bonds</text>
  <text x="970" y="520" text-anchor="middle" font-family="Arial" font-size="20" fill="#475569">negative charge shared by both oxygens</text>

  <text x="415" y="365" text-anchor="middle" font-family="Arial" font-size="50" fill="#2563eb">↔</text>
  <text x="785" y="365" text-anchor="middle" font-family="Arial" font-size="42" fill="#7c3aed">→</text>

  <rect x="180" y="585" width="840" height="72" rx="20" fill="#0f172a"/>
  <text x="600" y="630" text-anchor="middle" font-family="Arial" font-size="24" fill="#fff">Contributors are drawings; the hybrid is the real electronic structure.</text>
</svg>
