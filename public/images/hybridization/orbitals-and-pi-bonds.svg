<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Unhybridized p orbitals in sp2 and sp carbon</title>
  <desc id="desc">Two panels show one p orbital remaining for sp2 carbon and two perpendicular p orbitals remaining for sp carbon.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8fafc"/><stop offset="1" stop-color="#eef2ff"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0f172a" flood-opacity=".10"/></filter>
  </defs>
  <rect width="1200" height="720" rx="30" fill="url(#bg)"/>
  <text x="600" y="68" text-anchor="middle" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#0f172a">Hybrid orbitals and pi bonding</text>
  <text x="600" y="106" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#475569">Unhybridized p orbitals overlap sideways to form pi bonds</text>
  <g filter="url(#shadow)"><rect x="70" y="145" width="500" height="500" rx="26" fill="#fff"/><rect x="630" y="145" width="500" height="500" rx="26" fill="#fff"/></g>

  <g font-family="Arial, sans-serif" text-anchor="middle">
    <text x="320" y="205" font-size="27" font-weight="700" fill="#7c3aed">sp² carbon: one p orbital remains</text>
    <line x1="205" y1="385" x2="435" y2="385" stroke="#334155" stroke-width="8" stroke-linecap="round"/>
    <circle cx="245" cy="385" r="34" fill="#ede9fe" stroke="#7c3aed" stroke-width="5"/><circle cx="395" cy="385" r="34" fill="#ede9fe" stroke="#7c3aed" stroke-width="5"/>
    <text x="245" y="395" font-size="26" font-weight="700" fill="#7c3aed">C</text><text x="395" y="395" font-size="26" font-weight="700" fill="#7c3aed">C</text>
    <g fill="#c4b5fd" stroke="#7c3aed" stroke-width="3" opacity=".82">
      <ellipse cx="245" cy="300" rx="28" ry="72"/><ellipse cx="245" cy="470" rx="28" ry="72"/>
      <ellipse cx="395" cy="300" rx="28" ry="72"/><ellipse cx="395" cy="470" rx="28" ry="72"/>
    </g>
    <path d="M270 300 C305 270 335 270 370 300" fill="none" stroke="#8b5cf6" stroke-width="16" stroke-linecap="round" opacity=".45"/>
    <path d="M270 470 C305 500 335 500 370 470" fill="none" stroke="#8b5cf6" stroke-width="16" stroke-linecap="round" opacity=".45"/>
    <text x="320" y="560" font-size="20" font-weight="700" fill="#0f172a">One π bond in C=C</text>
    <text x="320" y="592" font-size="17" fill="#475569">p orbitals remain parallel and overlap above and below</text>

    <text x="880" y="205" font-size="27" font-weight="700" fill="#059669">sp carbon: two p orbitals remain</text>
    <line x1="750" y1="385" x2="1010" y2="385" stroke="#334155" stroke-width="8" stroke-linecap="round"/>
    <circle cx="825" cy="385" r="34" fill="#d1fae5" stroke="#059669" stroke-width="5"/><circle cx="955" cy="385" r="34" fill="#d1fae5" stroke="#059669" stroke-width="5"/>
    <text x="825" y="395" font-size="26" font-weight="700" fill="#047857">C</text><text x="955" y="395" font-size="26" font-weight="700" fill="#047857">C</text>
    <g fill="#6ee7b7" stroke="#059669" stroke-width="3" opacity=".74">
      <ellipse cx="825" cy="295" rx="26" ry="70"/><ellipse cx="825" cy="475" rx="26" ry="70"/>
      <ellipse cx="955" cy="295" rx="26" ry="70"/><ellipse cx="955" cy="475" rx="26" ry="70"/>
      <ellipse cx="735" cy="385" rx="70" ry="26"/><ellipse cx="915" cy="385" rx="70" ry="26" opacity=".4"/>
      <ellipse cx="845" cy="385" rx="70" ry="26" opacity=".4"/><ellipse cx="1045" cy="385" rx="70" ry="26"/>
    </g>
    <path d="M850 295 C880 270 900 270 930 295" fill="none" stroke="#10b981" stroke-width="15" stroke-linecap="round" opacity=".42"/>
    <path d="M850 475 C880 500 900 500 930 475" fill="none" stroke="#10b981" stroke-width="15" stroke-linecap="round" opacity=".42"/>
    <text x="880" y="560" font-size="20" font-weight="700" fill="#0f172a">Two π bonds in C≡C</text>
    <text x="880" y="592" font-size="17" fill="#475569">two perpendicular p-orbital sets overlap independently</text>
  </g>
</svg>
