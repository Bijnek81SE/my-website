<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">sp3, sp2 and sp hybridization comparison</title>
  <desc id="desc">Three panels compare tetrahedral sp3, trigonal planar sp2 and linear sp carbon geometry.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#eff6ff"/><stop offset="1" stop-color="#f8fafc"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#0f172a" flood-opacity=".10"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker>
  </defs>
  <rect width="1200" height="760" rx="30" fill="url(#bg)"/>
  <text x="600" y="70" text-anchor="middle" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#0f172a">Carbon hybridization and geometry</text>
  <text x="600" y="108" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#475569">Four, three, or two electron groups determine orbital arrangement</text>

  <g filter="url(#shadow)">
    <rect x="55" y="145" width="340" height="535" rx="26" fill="#fff"/>
    <rect x="430" y="145" width="340" height="535" rx="26" fill="#fff"/>
    <rect x="805" y="145" width="340" height="535" rx="26" fill="#fff"/>
  </g>

  <g font-family="Arial, sans-serif" text-anchor="middle">
    <text x="225" y="205" font-size="30" font-weight="700" fill="#1d4ed8">sp³</text>
    <text x="600" y="205" font-size="30" font-weight="700" fill="#7c3aed">sp²</text>
    <text x="975" y="205" font-size="30" font-weight="700" fill="#059669">sp</text>

    <g stroke="#2563eb" stroke-width="7" stroke-linecap="round">
      <line x1="225" y1="365" x2="225" y2="270"/>
      <line x1="225" y1="365" x2="140" y2="420"/>
      <line x1="225" y1="365" x2="310" y2="420"/>
      <line x1="225" y1="365" x2="265" y2="500"/>
    </g>
    <circle cx="225" cy="365" r="38" fill="#dbeafe" stroke="#2563eb" stroke-width="5"/>
    <text x="225" y="375" font-size="30" font-weight="700" fill="#1d4ed8">C</text>
    <g fill="#93c5fd" stroke="#2563eb" stroke-width="4"><circle cx="225" cy="265" r="22"/><circle cx="135" cy="423" r="22"/><circle cx="315" cy="423" r="22"/><circle cx="268" cy="505" r="22"/></g>
    <text x="225" y="565" font-size="21" font-weight="700" fill="#0f172a">Tetrahedral</text>
    <text x="225" y="600" font-size="18" fill="#475569">4 electron groups</text>
    <text x="225" y="633" font-size="18" fill="#475569">109.5° ideal angle</text>

    <g stroke="#7c3aed" stroke-width="7" stroke-linecap="round">
      <line x1="600" y1="370" x2="600" y2="260"/>
      <line x1="600" y1="370" x2="500" y2="430"/>
      <line x1="600" y1="370" x2="700" y2="430"/>
    </g>
    <ellipse cx="600" cy="300" rx="25" ry="75" fill="#ede9fe" stroke="#7c3aed" stroke-width="3" opacity=".75"/>
    <ellipse cx="600" cy="440" rx="25" ry="75" fill="#ede9fe" stroke="#7c3aed" stroke-width="3" opacity=".75"/>
    <circle cx="600" cy="370" r="38" fill="#ede9fe" stroke="#7c3aed" stroke-width="5"/>
    <text x="600" y="380" font-size="30" font-weight="700" fill="#7c3aed">C</text>
    <g fill="#c4b5fd" stroke="#7c3aed" stroke-width="4"><circle cx="600" cy="252" r="22"/><circle cx="495" cy="434" r="22"/><circle cx="705" cy="434" r="22"/></g>
    <text x="600" y="565" font-size="21" font-weight="700" fill="#0f172a">Trigonal planar</text>
    <text x="600" y="600" font-size="18" fill="#475569">3 electron groups</text>
    <text x="600" y="633" font-size="18" fill="#475569">120° ideal angle</text>

    <g stroke="#059669" stroke-width="8" stroke-linecap="round"><line x1="975" y1="370" x2="850" y2="370"/><line x1="975" y1="370" x2="1100" y2="370"/></g>
    <ellipse cx="975" cy="300" rx="24" ry="72" fill="#d1fae5" stroke="#059669" stroke-width="3" opacity=".75"/>
    <ellipse cx="975" cy="440" rx="24" ry="72" fill="#d1fae5" stroke="#059669" stroke-width="3" opacity=".75"/>
    <ellipse cx="905" cy="370" rx="72" ry="24" fill="#a7f3d0" stroke="#059669" stroke-width="3" opacity=".65"/>
    <ellipse cx="1045" cy="370" rx="72" ry="24" fill="#a7f3d0" stroke="#059669" stroke-width="3" opacity=".65"/>
    <circle cx="975" cy="370" r="38" fill="#d1fae5" stroke="#059669" stroke-width="5"/>
    <text x="975" y="380" font-size="30" font-weight="700" fill="#047857">C</text>
    <g fill="#6ee7b7" stroke="#059669" stroke-width="4"><circle cx="843" cy="370" r="22"/><circle cx="1107" cy="370" r="22"/></g>
    <text x="975" y="565" font-size="21" font-weight="700" fill="#0f172a">Linear</text>
    <text x="975" y="600" font-size="18" fill="#475569">2 electron groups</text>
    <text x="975" y="633" font-size="18" fill="#475569">180° ideal angle</text>
  </g>
</svg>
