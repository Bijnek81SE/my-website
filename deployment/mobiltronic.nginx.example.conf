# Include in the nginx http context (limit_req_zone requires it).
# Add only as a NEW virtual host after host/infrastructure authorization.
# TLS certificate provisioning and DNS are deliberately not automated here.
# Must not replace any existing bijan.se virtual host.
limit_req_zone $binary_remote_addr zone=mobiltronic_leads:10m rate=5r/m;
server {
    listen 443 ssl;
    server_name mobiltronic.bijan.se;
    ssl_certificate /etc/ssl/mobiltronic/fullchain.pem;
    ssl_certificate_key /etc/ssl/mobiltronic/privkey.pem;
    client_max_body_size 16k;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    location = /api/mobiltronic/leads {
        limit_req zone=mobiltronic_leads burst=3 nodelay;
        limit_req_status 429;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://127.0.0.1:3200;
    }
    location / {
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://127.0.0.1:3200;
    }
}
